name: Sync ByLampa

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add ByLampa upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/bylampa/bylampa.github.io.git
          git fetch upstream main

      - name: Sync ByLampa files
        run: |
          # Удаляем старое содержимое, но сохраняем GitHub Actions
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          # Копируем содержимое ByLampa
          git checkout upstream/main -- .

          # Удаляем workflow-файлы, которые могли прийти из upstream
          git restore --staged .github 2>/dev/null || true
          git checkout -- .github 2>/dev/null || true

      - name: Rewrite ByLampa URLs
        run: |
          OLD="https://bylampa.github.io"
          NEW="https://ilya-shambulin.github.io/mylampa.github.io"

          echo "Replacing:"
          echo "$OLD"
          echo "→"
          echo "$NEW"

          grep -IlR \
            --exclude-dir=.git \
            --exclude-dir=.github \
            "$OLD" . \
            | while read -r file; do
                echo "Patching: $file"
                sed -i "s#${OLD}#${NEW}#g" "$file"
              done

      - name: Check remaining ByLampa URLs
        run: |
          echo "Checking for remaining references..."

          if grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=.github \
            "bylampa.github.io" .; then

            echo ""
            echo "WARNING: Some references to bylampa.github.io remain."

          else
            echo "OK: No references to bylampa.github.io found."
          fi

      - name: Commit mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit \
            -m "Sync ByLampa and rewrite plugin URLs" \
            || echo "Nothing to commit"

          git push origin HEAD:main
