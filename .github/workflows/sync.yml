name: Sync ByLampa

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch ByLampa
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/bylampa/bylampa.github.io.git
          git fetch upstream main

      - name: Sync ByLampa files
        run: |
          # Удаляем всё, кроме .git и .github
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          # Распаковываем ByLampa поверх репозитория
          git archive upstream/main | tar -x

      - name: Rewrite ByLampa URLs
        run: |
          OLD="https://bylampa.github.io"
          NEW="https://ilya-shambulin.github.io/mylampa.github.io"

          echo "Replacing:"
          echo "$OLD"
          echo "→"
          echo "$NEW"

          grep -IlR \
            --exclude-dir=.git \
            --exclude-dir=.github \
            "$OLD" . \
            | while read -r file; do
                echo "Patching: $file"
                sed -i "s#${OLD}#${NEW}#g" "$file"
              done

      - name: Check ByLampa references
        run: |
          echo "Remaining references to bylampa.github.io:"

          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=.github \
            "bylampa.github.io" . \
            || echo "None found."

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Sync ByLampa and rewrite URLs"
          git push origin main
